name: Poll dispatcher daily fallback

on:
  schedule:
    # Once daily at 8:17 PM PDT / 7:17 PM PST.
    - cron: "17 3 * * *"
  workflow_dispatch:

# Never let two cron firings (or a cron + manual dispatch) overlap; that
# would race the alert idempotency check across instances.
concurrency:
  group: poll-cron
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Drain the poll queue via /api/internal/dispatch
        env:
          POLL_URL: ${{ vars.POLL_URL || 'https://www.uground.app/api/internal/dispatch' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET is not set; refusing to trigger poll." >&2
            exit 1
          fi
          # Each call works through jobs for ~30s and says whether the queue
          # is empty. The first call also adds jobs for followed artists that
          # don't have any yet.
          url="${POLL_URL}?sync=1"
          for call in $(seq 1 40); do
            response=$(mktemp)
            status=$(curl -sS -o "$response" -w "%{http_code}" \
              --request POST \
              --max-time 90 \
              --retry 2 --retry-delay 30 --retry-all-errors \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "$url")
            echo "Call $call: HTTP $status"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              cat "$response"
              echo
              exit 1
            fi
            jq -c '{synced, drained, claimed, succeeded, failed, skipped, deliveriesProcessed}' "$response"
            jq -c '.results[] | select(.status == "failed")' "$response"
            if [ "$(jq -r '.drained' "$response")" = "true" ]; then
              echo "Queue drained."
              exit 0
            fi
            url="$POLL_URL"
          done
          echo "Queue still not drained after 40 calls." >&2
          exit 1
